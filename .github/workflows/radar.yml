name: 观澜信源采集

on:
  schedule:
    # 每天两次：首尔时间 08:07 和 20:07（UTC 23:07 / 11:07）
    - cron: "7 23 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」

permissions:
  contents: write
  issues: write     # 推演到期对账：自动开「对账单」Issue、读取人工确认标签

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: 采集 + AI 分级
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/run.py
      - name: 提交更新后的数据
        run: |
          git config user.name "guanlan-bot"
          git config user.email "guanlan-bot@users.noreply.github.com"
          git add data/feed.json data/sims.json
          if git diff --cached --quiet; then echo "数据无变化"; exit 0; fi
          git commit -m "数据更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
